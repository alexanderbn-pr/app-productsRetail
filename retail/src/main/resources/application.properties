server.port=5000
spring.main.allow-bean-definition-overriding=true
mocks.base.url=http://localhost:3001

# Resilience4j — Rate Limiter
resilience4j.ratelimiter.instances.similarProducts.limit-for-period=10

# Resilience4j — Retry
resilience4j.retry.instances.similarProductsRetry.max-attempts=3
resilience4j.retry.instances.similarProductsRetry.wait-duration=500ms

# Resilience4j — Circuit Breaker + Bulkhead configured programmatically via ResilienceConfig
# (Property-based config would conflict with the CircuitBreakerConfigCustomizer and
#  BulkheadConfigCustomizer beans defined in ResilienceConfig. See that class for the
#  actual values: sliding-window=10, threshold=50%, wait=10s, halfOpen=3, maxConc=10, maxWait=500ms)

# Apache HC5 Connection Pool
httpclient.connection-pool.max-total=20
httpclient.timeout.connect=2s
httpclient.timeout.read=5s

# Caffeine Cache
cache.similar-ids.ttl=10m
cache.product-details.ttl=5m
cache.max-size=10000

# Thread Pool for Parallel Fetching
app.thread-pool.core-size=5
app.thread-pool.max-size=10
app.thread-pool.queue-capacity=50

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Actuator — health, info, metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging — correlation ID via MDC
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
